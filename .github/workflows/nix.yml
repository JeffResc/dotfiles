---
name: Nix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v6
        with:
          path: head
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check flake
        working-directory: head
        run: nix flake check --no-build --no-update-lock-file

      - name: Build personal configuration
        working-directory: head
        run: |
          nix build --no-link --print-out-paths --no-update-lock-file \
            .#darwinConfigurations.personal.system > "$RUNNER_TEMP/head-personal"

      - name: Check out base revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Compare personal closures
        if: github.event_name == 'pull_request'
        working-directory: base
        run: |
          base=$(nix build --no-link --print-out-paths --no-update-lock-file \
            .#darwinConfigurations.personal.system)
          head=$(<"$RUNNER_TEMP/head-personal")
          diff=$(nix store diff-closures "$base" "$head")
          {
            printf '## personal\n\n'
            if [ -n "$diff" ]; then
              printf '%s\n%s\n%s\n\n' '```text' "$diff" '```'
            else
              printf 'No closure changes.\n\n'
            fi
          } > "$RUNNER_TEMP/closure-diff.md"

      - name: Configure private cache credentials
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/b2"
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$B2_KEY_ID" "$B2_APPLICATION_KEY" > "$RUNNER_TEMP/b2/credentials"
          printf '%s\n' "$CACHE_SIGNING_KEY" > "$RUNNER_TEMP/b2/signing-key"
          sudo mkdir -p /var/root/.aws
          sudo cp "$RUNNER_TEMP/b2/credentials" /var/root/.aws/credentials
          sudo chmod 600 /var/root/.aws/credentials

      - name: Build work configuration and save private report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          NIX_PACKAGES_TOKEN: ${{ secrets.NIX_PACKAGES_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/b2/credentials"
          export NIX_CONFIG="access-tokens = github.com=$NIX_PACKAGES_TOKEN"
          cache='s3://jeffresc-dotfiles-nix-cache?endpoint=s3.us-east-005.backblazeb2.com&region=us-east-005'
          public_key=$(<head/.github/nix-cache.pub)
          log="$RUNNER_TEMP/b2/work.log"
          report="$RUNNER_TEMP/b2/work-diff.md"
          build() {
            nix build --no-link --print-out-paths --no-update-lock-file \
              --extra-substituters "$cache" --extra-trusted-public-keys "$public_key" \
              "$1#darwinConfigurations.work.system"
          }
          if ! head_path=$(build ./head 2> "$log"); then
            echo 'Work configuration build failed. Detailed output is not published.' >&2
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            if ! base_path=$(build ./base 2>> "$log"); then
              echo 'Base work configuration build failed. Detailed output is not published.' >&2
              exit 1
            fi
            nix store diff-closures "$base_path" "$head_path" > "$report" 2>> "$log"
            {
              printf '## work\n\n'
              if [ -s "$report" ]; then
                printf '%s\n%s\n%s\n\n' '```text' "$(<"$report")" '```'
              else
                printf 'No closure changes.\n\n'
              fi
            } >> "$RUNNER_TEMP/closure-diff.md"
            aws --endpoint-url https://s3.us-east-005.backblazeb2.com \
              --region us-east-005 s3 cp "$report" \
              "s3://jeffresc-dotfiles-nix-cache/reports/pr-$PR_NUMBER/$HEAD_SHA.txt" > /dev/null
          fi
          nix copy --to "$cache&secret-key=$RUNNER_TEMP/b2/signing-key" \
            "$head_path" >> "$log" 2>&1

      - name: Save closure diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: closure-diff
          path: ${{ runner.temp }}/closure-diff.md
          if-no-files-found: error

  comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: closure-diff
      - name: Update closure diff comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nix-closure-diff -->';
            const diff = fs.readFileSync('closure-diff.md', 'utf8');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const limit = 60000;
            const report = diff.length > limit
              ? `Closure diff is too large for a comment. Download the complete report from the [workflow run](${run}).`
              : diff;
            const body = `${marker}\n# Nix closure diff\n\nBase: ${context.payload.pull_request.base.sha}\nHead: ${context.payload.pull_request.head.sha} (tested as the merge commit)\n\n${report}`;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }
